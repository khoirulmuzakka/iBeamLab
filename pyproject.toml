[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "ibeamlab"
version = "0.1.0"
description = "Python-first ion-beam simulation, dataset generation, and ONNX inference"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "iBeamLab contributors"}]
dependencies = [
  "numpy>=1.24",
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
training = ["torch>=2"]
dev = ["build>=1", "pytest>=8", "twine>=5"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = [
  "-DBUILD_SHARED_LIBS=ON",
  "-DIBEAMLAB_BUILD_PYTHON=ON",
  "-DIBEAMLAB_BUILD_TESTS=OFF",
  "-DIBEAMLAB_BUILD_EXAMPLES=OFF",
]
wheel.packages = ["ibeamlab"]
sdist.include = ["CMakeLists.txt", "cmake/**", "native/**", "ibeamlab/**", "docs/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
