[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "ibeamlab"
version = "0.1.0"
description = "A unified framework for ion-beam simulation and analysis, ML model training, and deployment in Python and C++"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "iBeamLab contributors"}]
keywords = [
  "ion-beam-analysis", "elemental-depth-profiles", "simulation", "fitting",
  "machine-learning", "surrogate-models", "onnx", "simnra",
]
dependencies = [
  "numpy>=1.24",
  "tqdm>=4.66",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/khoirulmuzakka/ibeamlab"
Documentation = "https://github.com/khoirulmuzakka/ibeamlab/blob/master/README.md"
Repository = "https://github.com/khoirulmuzakka/ibeamlab"
Issues = "https://github.com/khoirulmuzakka/ibeamlab/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
training = ["torch>=2", "onnx>=1.16", "onnxruntime>=1.17"]
examples = ["tomli>=2; python_version < '3.11'"]
dev = ["build>=1", "pytest>=8", "twine>=5", "mypy>=1.10,<3", "tomli>=2; python_version < '3.11'"]

[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
cmake.args = [
  "-DBUILD_SHARED_LIBS=ON",
  "-DIBEAMLAB_BUILD_PYTHON=ON",
  "-DIBEAMLAB_BUILD_TESTS=OFF",
  "-DIBEAMLAB_BUILD_EXAMPLES=OFF",
]
wheel.packages = ["ibeamlab"]
sdist.include = ["licenses/**", "tools/build_minion.py", "CMakeLists.txt", "README.md", "cmake/**", "docs/**", "cpp/CMakeLists.txt", "cpp/src/**", "cpp/include/**", "cpp/python/**", "ibeamlab/**", "tests/**", "examples/**"]
sdist.exclude = ["old/**", "build*/**", "cpp/build*/**", "xnra/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
